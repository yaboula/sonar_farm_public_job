name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 zip python3-pil
      - name: Verify release contract
        run: |
          lua5.4 scripts/check_version.lua
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Run Lua gates
        run: |
          find . -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac5.4 -p
          lua5.4 tests/run.lua
          lua5.4 scripts/generate_items.lua --check
          python3 scripts/process_item_assets.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            inspection-ui/package-lock.json
            minigames-ui/package-lock.json
            web/package-lock.json
      - name: Build and test inspection HUD NUI
        working-directory: inspection-ui
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Build and test minigame NUI
        working-directory: minigames-ui
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Build and test Public Job Hub NUI
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm run test:sites
      - name: Package FiveM resource
        run: |
          mkdir -p release/sonar_farm_publicjob/inspection-ui release/sonar_farm_publicjob/minigames-ui release/sonar_farm_publicjob/web
          cp -R bridge client config data database docs inventory_images nui-shell server shared release/sonar_farm_publicjob/
          cp -R inspection-ui/dist release/sonar_farm_publicjob/inspection-ui/dist
          cp -R minigames-ui/dist release/sonar_farm_publicjob/minigames-ui/dist
          cp -R web/build release/sonar_farm_publicjob/web/build
          cp fxmanifest.lua README.md CHANGELOG.md VERSION release/sonar_farm_publicjob/
          cd release
          zip -qr "sonar_farm_publicjob-$(cat ../VERSION).zip" sonar_farm_publicjob
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "release/sonar_farm_publicjob-$(cat VERSION).zip" --verify-tag --generate-notes --title "sonar_farm_publicjob $(cat VERSION)"
