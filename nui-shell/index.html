<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonar Farm NUI Shell</title>
    <style>
      html,body,#surface,#inspection,#field-hud{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
      #surface{display:none} iframe{display:none;width:100%;height:100%;border:0;background:transparent}
      #surface[data-active="hub"],#surface[data-active="minigame"]{display:block}
      #surface[data-active="hub"] #hub,#surface[data-active="minigame"] #minigame{display:block}
      #inspection{position:fixed;inset:0;display:none;pointer-events:none}
      #inspection.is-visible{display:block}
      #field-hud{position:fixed;inset:0;display:none;pointer-events:none}
      #field-hud.is-visible:not(.is-suppressed){display:block}
    </style>
  </head>
  <body>
    <main id="surface" aria-live="polite">
      <iframe id="hub" src="../web/build/index.html" title="Sonar Farm Public Job Hub"></iframe>
      <iframe id="minigame" src="../minigames-ui/dist/index.html" title="Sonar Farm Planting"></iframe>
    </main>
    <iframe id="inspection" src="../inspection-ui/dist/index.html" title="Sonar Farm Crop Inspection"></iframe>
    <iframe id="field-hud" src="../field-hud/dist/index.html" title="Sonar Farm Field Operations" allowtransparency="true"></iframe>
    <script>
      const surface = document.getElementById('surface');
      const frames = { hub: document.getElementById('hub'), minigame: document.getElementById('minigame'), inspection: document.getElementById('inspection'), fieldHud: document.getElementById('field-hud') };
      const pending = { hub: [], minigame: [], inspection: [], fieldHud: [] };
      const ready = { hub: false, minigame: false, inspection: false, fieldHud: false };
      for (const [name, frame] of Object.entries(frames)) frame.addEventListener('load', () => {
        ready[name] = true;
        pending[name].splice(0).forEach((message) => frame.contentWindow.postMessage(message, '*'));
      });
      function forward(name, message) {
        if (ready[name]) frames[name].contentWindow.postMessage(message, '*'); else pending[name].push(message);
      }
      function activate(name) { surface.dataset.active = name; frames.fieldHud.classList.add('is-suppressed'); }
      function close(name) { if (surface.dataset.active === name) { delete surface.dataset.active; frames.fieldHud.classList.remove('is-suppressed'); } }
      function hideInspection() { frames.inspection.classList.remove('is-visible'); }
      window.addEventListener('message', (event) => {
        const message = event.data;
        if (!message || typeof message.type !== 'string') return;
        if (message.type.startsWith('tomatoPlant:')) {
          if (message.type === 'tomatoPlant:close') close('minigame'); else { hideInspection(); activate('minigame'); }
          forward('minigame', message);
        } else if (message.type.startsWith('hub:')) {
          if (message.type === 'hub:close') close('hub'); else { hideInspection(); activate('hub'); }
          forward('hub', message);
        } else if (message.type.startsWith('inspection:')) {
          frames.inspection.classList.toggle('is-visible', message.type !== 'inspection:close');
          forward('inspection', message);
        } else if (message.type.startsWith('fieldHud:')) {
          frames.fieldHud.classList.toggle('is-visible', message.type !== 'fieldHud:hide');
          forward('fieldHud', message);
        }
      });
    </script>
  </body>
</html>
